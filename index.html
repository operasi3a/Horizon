<template id="cam-tpl"><!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Horizon — Kamera</title>
<style>
  /* Halaman kamera Horizon (v1.7). Dibuka sebagai jendela popup (top-level) karena browser memblokir kamera di dalam iframe Apps Script.
     Dipakai dua cara: (1) otomatis lewat blob URL dari App.html; (2) di-host di domain HTTPS sendiri → URL diisi lewat setCameraRelay(). */
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:#06101f;color:#dbe7ff;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
  h1{font-size:16px;margin:0;font-weight:700;color:#fff}
  video{width:100%;max-width:720px;max-height:70vh;border-radius:16px;background:#000;object-fit:cover}
  p{font-size:13px;margin:0;text-align:center;max-width:560px;line-height:1.5}
  .err{color:#ffb4b4}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.12);color:#fff}
  button.primary{background:linear-gradient(135deg,#3B82F6,#0FA898);min-width:160px}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<h1>Horizon — Kamera</h1>
<video id="v" autoplay playsinline muted></video>
<p id="msg">Menyalakan kamera… Bila browser bertanya, pilih <b>Izinkan</b>.</p>
<div class="row"><button id="retry" class="primary" type="button" hidden>Nyalakan kamera</button><button id="flip" type="button">Ganti kamera</button><button id="shot" class="primary" type="button" disabled>Ambil foto</button><button id="close" type="button">Batal</button></div>
<script>
(function () {
  var video = document.getElementById('v'), msg = document.getElementById('msg'), shot = document.getElementById('shot'), flip = document.getElementById('flip');
  var stream = null, facing = 'environment', attempt = 0;
  function stop() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  function send(payload) { try { if (window.opener) window.opener.postMessage(payload, '*'); } catch (e) { } }
  // v1.7.6: tiga tingkat constraint — resolusi ideal → hanya facingMode → video:true (Safari/WebKit kadang AbortError pada constraint detail)
  function constraints() { return attempt === 0 ? { video: { facingMode: { ideal: facing }, width: { ideal: 1600 }, height: { ideal: 1200 } }, audio: false }
    : attempt === 1 ? { video: { facingMode: facing }, audio: false } : { video: true, audio: false }; }
  function start() {
    stop(); shot.disabled = true; msg.className = ''; msg.textContent = 'Menyalakan kamera… Bila browser bertanya, pilih Izinkan.'; retry.hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fail({ name: 'Tidak didukung', message: 'Browser tidak mendukung kamera web' }); return; }
    navigator.mediaDevices.getUserMedia(constraints())
      .then(function (s) { stream = s; video.srcObject = s; return video.play().catch(function () { }); })
      .then(function () { shot.disabled = false; msg.textContent = 'Arahkan kamera ke objek, lalu klik "Ambil foto". Foto diberi watermark tanggal/jam otomatis oleh aplikasi.'; })
      .catch(function (e) { if (attempt < 2 && !/NotAllowed|Permission/i.test(e.name || '')) { attempt++; start(); } else fail(e); });
  }
  function fail(e) {
    msg.className = 'err';
    msg.textContent = 'Kamera tidak dapat diakses (' + (e.name || '') + (e.message ? ': ' + e.message : '') + '). Periksa izin kamera browser untuk situs ini (ikon gembok/AA di bilah alamat → Kamera: Izinkan), pastikan tidak dipakai aplikasi lain, lalu tekan "Nyalakan kamera".';
    retry.hidden = false;
    send({ hz: 'camera-error', name: e.name || '', message: e.message || '' });
  }
  var retry = document.getElementById('retry');
  retry.addEventListener('click', function () { attempt = 0; start(); });   // dipanggil dari gesture pengguna (syarat sebagian browser)
  shot.addEventListener('click', function () {
    var cv = document.createElement('canvas'); cv.width = video.videoWidth || 1280; cv.height = video.videoHeight || 960;
    cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
    var dataUrl = cv.toDataURL('image/jpeg', 0.92); stop();
    send({ hz: 'photo', dataUrl: dataUrl }); msg.textContent = 'Foto terkirim ke aplikasi. Jendela ini akan ditutup…';
    setTimeout(function () { window.close(); }, 300);
  });
  flip.addEventListener('click', function () { facing = facing === 'environment' ? 'user' : 'environment'; start(); });
  document.getElementById('close').addEventListener('click', function () { stop(); send({ hz: 'camera-cancel' }); window.close(); });
  window.addEventListener('beforeunload', stop);
  start();
})();
</script>
</body>
