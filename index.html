<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon</title>
<meta name="theme-color" content="#04070D">
<link rel="icon" type="image/png" href="https://i.ibb.co.com/Y4cH9GQ4/3-A-Putih-1x1.png">
<link rel="apple-touch-icon" href="https://i.ibb.co.com/Y4cH9GQ4/3-A-Putih-1x1.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#04070D;--deep2:#0A1830;--deep3:#123059;--signal:#3B82F6;--aqua:#5EC8FF;--ink:#101828;--mist:#B9C6DC;--muted:#667085;
  --glass-bg:linear-gradient(135deg,rgba(59,130,246,.22),rgba(94,200,255,.06) 45%,rgba(10,17,32,.55));
  --glass-strong:linear-gradient(135deg,rgba(59,130,246,.28),rgba(94,200,255,.08) 45%,rgba(6,11,22,.68));
  --glass-border:rgba(255,255,255,.16);--glass-hl:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 40px rgba(59,130,246,.10);
  --blur:26px;--blur-strong:32px;--sat:160%;--text:#B9C6DC;--head:#F7FAFF;--shadow:0 24px 55px rgba(0,0,0,.55);
  --nav-glow:0 0 0 6px rgba(59,130,246,.18),0 8px 20px rgba(59,130,246,.45);--danger:#F87171;--ok:#34D399;--warn:#FBBF24;
  --r-lg:24px;--r-md:18px;--r-sm:12px;
  /* palet grafik kategorikal (tervalidasi CVD/kontras di permukaan gelap) + grid/track */
  --c1:#3B82F6;--c2:#C4790A;--c3:#0FA898;--c4:#8B5CF6;--c5:#E0489A;--grid:rgba(255,255,255,.10);--track:rgba(255,255,255,.10);--surface:#0A1830;
}
html[data-theme="light"]{
  /* v1.7.1: mode terang = glassmorphism (panel kaca putih tembus pandang + blur) di atas latar "horizon" biru muda minimalis */
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.42));--glass-strong:linear-gradient(160deg,rgba(255,255,255,.80),rgba(244,248,255,.62));
  --glass-border:rgba(255,255,255,.85);--glass-hl:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 36px rgba(59,130,246,.05);--blur:18px;--blur-strong:26px;--sat:150%;
  --text:#5B6B84;--head:#101828;--shadow:0 20px 48px rgba(37,99,235,.13);--nav-glow:0 0 0 6px rgba(59,130,246,.14),0 8px 18px rgba(59,130,246,.32);
  --c1:#2563EB;--c2:#B45309;--c3:#0D9488;--c4:#7C3AED;--c5:#DB2777;--grid:rgba(16,24,40,.10);--track:rgba(16,24,40,.08);--surface:#F5F8FC;--ok:#16A34A;--warn:#D97706;--danger:#DC2626;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Inter,sans-serif;color:var(--text);background:radial-gradient(1000px 560px at 10% -10%,rgba(59,130,246,.14),transparent 60%),linear-gradient(165deg,var(--deep),var(--deep2) 55%,var(--deep3));min-height:100vh;transition:background .4s}
/* latar "horizon" mode terang (v1.7.1): langit biru muda → putih di garis cakrawala (±62% tinggi) dengan pendar matahari, lalu biru pucat di bawah */
html[data-theme="light"] body{background:
  radial-gradient(520px 200px at 50% 62%,rgba(255,255,255,.95),rgba(94,200,255,.28) 45%,transparent 72%),
  linear-gradient(180deg,transparent 61.7%,rgba(59,130,246,.30) 62%,rgba(59,130,246,.30) 62.2%,transparent 62.6%),
  linear-gradient(180deg,#CFE3FF 0%,#E4F0FF 34%,#F6FAFF 61.8%,#DDEBFF 62.4%,#E9F2FF 100%);background-attachment:fixed}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0;color:var(--head)}p{margin:0}
.hidden,[hidden]{display:none!important} /* [hidden] harus menang atas display:flex milik .field/.btn */
.bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .4s}
html[data-theme="light"] .bg-blobs{opacity:.55}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:520px;height:520px;top:-140px;left:-120px;background:radial-gradient(circle,#BFE0FF,transparent 70%)}
.b2{width:560px;height:560px;top:-80px;right:-160px;background:radial-gradient(circle,#D8ECFF,transparent 70%)}
.b3{width:480px;height:480px;bottom:-160px;right:5%;background:radial-gradient(circle,#CFE6FF,transparent 70%)}
.b4{width:440px;height:440px;bottom:-120px;left:-100px;background:radial-gradient(circle,#EAF3FF,transparent 70%)}
.screen{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;justify-content:center;padding:16px;container-type:inline-size;container-name:horizon}
#screen-login{overflow:auto}
.glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r-md);backdrop-filter:blur(var(--blur)) saturate(var(--sat));box-shadow:var(--glass-hl)}
.card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r-md);backdrop-filter:blur(var(--blur)) saturate(var(--sat));box-shadow:var(--glass-hl);padding:14px}
/* brand */
.brand{display:flex;align-items:center;gap:10px}.brand.big{justify-content:center;margin-bottom:22px}
.brand-mark{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--signal),var(--aqua))}
.brand-mark svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.brand-name{font-family:"Space Grotesk";font-weight:700;font-size:18px;color:var(--head)}.brand-sub{font-size:11.5px;color:var(--text)}
/* login */
.login-card{align-self:center;width:100%;max-width:380px;padding:28px 24px;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:28px;backdrop-filter:blur(var(--blur-strong)) saturate(var(--sat));box-shadow:var(--shadow),var(--glass-hl);display:flex;flex-direction:column;gap:12px}
/* app shell */
.app-shell{width:100%;max-width:1180px;height:100%;min-height:0;display:flex;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:28px;backdrop-filter:blur(var(--blur-strong)) saturate(var(--sat));box-shadow:var(--shadow),var(--glass-hl);overflow:hidden}
.nav-rail{display:none;flex-direction:column;gap:6px;padding:22px 10px;width:76px;border-right:1px solid var(--glass-border);align-items:center}
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.hdr-actions{display:flex;gap:6px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--head);cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.content{padding:12px 18px 24px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.content>*{flex-shrink:0} /* anak .content tidak boleh menyusut (mis. .tabs yang overflow-x:auto) karena .content sendiri yang menggulir */
.nav-item{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;gap:12px}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item p{display:none;font-size:13px;font-weight:600}
.nav-item.active{background:linear-gradient(135deg,var(--signal),var(--aqua));color:#fff;box-shadow:var(--nav-glow)}
/* navigasi bawah (HP): selalu terlihat karena .content yang menggulir, bukan halaman; berlabel; aman untuk notch */
.bottom-nav{display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--glass-border);background:var(--glass-strong);flex-shrink:0}
.bottom-nav .nav-item{width:auto;min-width:50px;flex:1 1 0;height:auto;flex-direction:column;gap:3px;padding:7px 4px;border-radius:14px}
.bottom-nav .nav-item p{display:block;font-size:9px;line-height:1;font-weight:600;white-space:nowrap;letter-spacing:-.1px}.bottom-nav .nav-item.active{box-shadow:0 6px 16px rgba(59,130,246,.35)}
.bottom-nav .nav-item{min-width:0;padding:7px 2px} /* v1.7: hingga 7 menu (Heatmap) muat di layar 360px */
@container horizon (min-width:680px){.nav-rail{display:flex}.bottom-nav{display:none}.content{padding:16px 24px 26px}}
/* HP (<680px): layar penuh tanpa bingkai kaca, header ringkas, tab bisa digeser, input 16px (cegah zoom iOS), tombol utama selebar layar */
@container horizon (max-width:679px){
  .screen{padding:0}#screen-app.screen{padding:0}.app-shell{border-radius:0;border:none;box-shadow:none;max-width:none}
  .app-header{padding:calc(10px + env(safe-area-inset-top)) 14px 6px}.brand-sub{display:none}.brand-name{font-size:16px}.app-header .logo-mark{display:none}.logo-utama{height:30px;width:118px}.icon-btn{width:36px;height:36px}.scope-sel{max-width:110px;height:36px;font-size:11.5px}.hdr-actions{gap:4px}
  .content{padding:10px 14px 20px;gap:12px}.greeting h2{font-size:18px}.greeting p{font-size:12px}
  .card{padding:12px}.score-card{padding:14px;gap:14px}.ring{width:84px;height:84px}.ring-value b{font-size:20px}.score-card h3{font-size:15px}
  .stat-card b{font-size:22px}.map{height:230px}.map-lg{height:320px}.map-xl{height:min(58vh,440px)}.section-head h3{font-size:14px}.stat-grid-3{gap:8px}.stat-grid-3 .stat-card{padding:10px 8px}.stat-grid-3 .stat-card span{font-size:10px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tabs button{flex-shrink:0;padding:9px 14px}
  .field input,.field select,.field textarea{font-size:16px;padding:11px 12px}
  .btn:not(.sm){width:100%;min-height:46px}.btn.sm{min-height:36px}.tri button{padding:8px 12px;font-size:13px}
  .row-card{padding:10px}.chart-card{padding:12px 10px}.toast{bottom:calc(84px + env(safe-area-inset-bottom));font-size:12.5px}
}
@container horizon (min-width:1040px){.nav-rail{width:220px;align-items:flex-start;padding:26px 18px}.nav-item{width:100%;justify-content:flex-start;padding:0 12px}.nav-item p{display:block}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}}
/* components */
.greeting h2{font-size:20px}.greeting p{font-size:13px;margin-top:2px}
.score-card{display:flex;align-items:center;gap:18px;padding:20px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--deep)}html[data-theme="light"] .ring::before{background:rgba(255,255,255,.92)}
.ring-value{position:relative;text-align:center}.ring-value b{font-family:"Space Grotesk";font-size:22px;color:var(--head)}.ring-value span{display:block;font-size:9.5px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04)}
html[data-theme="light"] .chip{background:rgba(255,255,255,.6)}
.sla-legend{display:flex;flex-direction:column;gap:6px;padding:12px}.sla-legend>b{font-size:12.5px;color:var(--head)}.sla-legend .chip-row{margin-top:0}
.chip-Mendesak{border-color:rgba(248,113,113,.5);color:var(--danger)}.chip-Tinggi{border-color:rgba(251,191,36,.5);color:var(--warn)}.chip-Sedang{border-color:rgba(94,200,255,.5);color:var(--aqua)}.chip-Rendah{border-color:rgba(52,211,153,.5);color:var(--ok)}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat-card b{font-family:"Space Grotesk";font-size:20px;color:var(--head);display:block}.stat-card span{font-size:11px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-top:4px}.section-head h3{font-size:14.5px}.section-head a,.link{font-size:12px;color:var(--aqua);font-weight:600;cursor:pointer;text-decoration:none}
.list{display:flex;flex-direction:column;gap:10px}
.row-card{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}
.ba{display:flex;border-radius:10px;overflow:hidden;width:76px;height:52px;flex-shrink:0;background:#2a2f3a}.ba img,.ba div{flex:1;object-fit:cover;min-width:0}
.ba .before{background:linear-gradient(160deg,#6b5a49,#40372c)}.ba .after{background:linear-gradient(160deg,var(--aqua),var(--signal))}
.info{flex:1;min-width:0}.info b{font-size:13px;color:var(--head);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{font-size:11px}
.pill{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill.Open{background:rgba(248,113,113,.15);color:var(--danger);border-color:rgba(248,113,113,.4)}
.pill.InProgress{background:rgba(251,191,36,.15);color:var(--warn);border-color:rgba(251,191,36,.4)}
.pill.Close,.pill.ok{background:rgba(94,200,255,.18);color:var(--aqua);border-color:rgba(94,200,255,.4)}
.pill.Menunggu{background:rgba(251,191,36,.15);color:var(--warn)}
.pill.Nonaktif{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--glass-border)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.zone-row,.user-row{flex-wrap:wrap}.zone-row .info,.user-row .info{flex:1 1 160px;min-width:160px}
@container horizon (max-width:679px){.zone-row .row-actions,.user-row .row-actions{flex:1 0 100%;justify-content:flex-end}.form-row{grid-template-columns:1fr}.app-header{flex-wrap:wrap;gap:8px}.hdr-actions{margin-left:auto}}
.field select,.field input{min-width:0;width:100%}
.scope-sel{height:38px;border-radius:19px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--head);font-family:Inter;font-size:12px;font-weight:600;padding:0 10px;max-width:150px}
.app-header{gap:8px}.hdr-actions{align-items:center;flex-wrap:wrap;justify-content:flex-end}
/* grafik Beranda */
.stat-grid-5{grid-template-columns:repeat(2,minmax(0,1fr))}@container horizon (min-width:680px){.stat-grid-5{grid-template-columns:repeat(3,minmax(0,1fr))}}@container horizon (min-width:1040px){.stat-grid-5{grid-template-columns:repeat(6,minmax(0,1fr))}}
.lb.top1 .rank{background:linear-gradient(135deg,#F5B300,#FFD966);color:#3a2a00}.lb.top2 .rank{background:linear-gradient(135deg,#B8C2CC,#E6ECF2);color:#1f2933}.lb.top3 .rank{background:linear-gradient(135deg,#B87333,#E0A672);color:#2b1a09}.lb-score{font-family:"Space Grotesk";font-size:18px;color:var(--head)}
.guide .contoh{background:rgba(94,200,255,.08);border:1px dashed rgba(94,200,255,.4);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55}.guide .contoh b{color:var(--head)}.guide .contoh code{font-family:"Space Grotesk",monospace;color:var(--aqua)}
.ring-stat{display:flex;align-items:center;gap:10px}.mini-ring{position:relative;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--deep)}html[data-theme="light"] .mini-ring::before{background:#fff}
.mini-ring b{position:relative;font-family:"Space Grotesk";font-size:12.5px;color:var(--head);display:inline}.ring-stat .lbl{display:block;font-size:11px;font-weight:600;color:var(--head)}.ring-stat .sub{font-size:10.5px;display:block}
.chart-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}@container horizon (min-width:680px){.chart-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart-card{display:flex;flex-direction:column;gap:6px}.chart-card h3{font-size:13.5px}.chart-card .hint{min-height:0}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart .grid{stroke:var(--grid);stroke-width:1}.chart .tick{font-size:11px;fill:var(--text);font-family:Inter,sans-serif}
.chart .val{fill:var(--head);font-weight:600}.chart .lbl{fill:var(--head)}.chart .inbar{font-size:11px;fill:#fff;font-weight:600}.chart .track{fill:var(--track)}.chart .mark{cursor:pointer}.chart .dot{stroke:var(--surface);stroke-width:2;cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin:2px 0 6px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.chart-tip{position:fixed;z-index:70;pointer-events:none;background:#111827;color:#fff;font-size:11.5px;padding:6px 9px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.4);display:none;line-height:1.35}
/* forms */
.field{display:flex;flex-direction:column;gap:5px}.field>span,.field label{font-size:11.5px;font-weight:600}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);color:var(--head);font-family:Inter;font-size:14px}
html[data-theme="light"] .field input,html[data-theme="light"] .field select,html[data-theme="light"] .field textarea{background:rgba(255,255,255,.72);border-color:rgba(16,24,40,.10)}
html[data-theme="light"] .tri button:not(.active),html[data-theme="light"] .tabs button:not(.active){background:rgba(255,255,255,.55);border-color:rgba(16,24,40,.08)} /* v1.7.2: :not(.active) — sebelumnya menimpa gaya aktif (teks putih di latar putih) */
html[data-theme="light"] .btn:not(.primary):not(.danger){background:rgba(255,255,255,.62);border-color:rgba(16,24,40,.08)}
html[data-theme="light"] .check-item,html[data-theme="light"] .nav-user,html[data-theme="light"] .nav-foot,html[data-theme="light"] .nav-rail,html[data-theme="light"] .bottom-nav,html[data-theme="light"] .app-header{border-color:rgba(16,24,40,.07)}
html[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(150%)}
html[data-theme="light"] .ba{background:#DCE6F5}html[data-theme="light"] .zone-label{background:rgba(255,255,255,.85);color:#101828;border-color:rgba(37,99,235,.4)}html[data-theme="light"] .zone-label.hot{color:#9A3412;border-color:#F59E0B}
/* daftar pilihan <select>: di mode gelap browser memakai popup putih → teks putih tak terbaca; paksa skema warna & warna opsi */
html[data-theme="dark"] select{color-scheme:dark}html[data-theme="light"] select{color-scheme:light}
select option{background:#0F1A2E;color:#F7FAFF}html[data-theme="light"] select option{background:#fff;color:#101828}
/* kamera dalam aplikasi */
.cam-video{width:100%;max-height:62vh;border-radius:14px;background:#000;object-fit:cover;display:block}
/* login */
.login-foot{margin-top:4px;text-align:center;font-size:11px;color:var(--text);opacity:.85}.login-foot b{color:var(--head);font-weight:600}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--glass-border);border-top-color:var(--aqua);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
.form{display:flex;flex-direction:column;gap:12px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;padding:13px 16px;border-radius:14px;font-family:Inter;font-weight:700;font-size:14px;cursor:pointer;color:var(--head);background:var(--glass-bg);border:1px solid var(--glass-border)}
.btn.primary{color:#fff;background:linear-gradient(90deg,var(--signal),var(--aqua));border:none}.btn.danger{color:#fff;background:var(--danger);border:none}.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;min-height:16px}.err{color:var(--danger)}
.check-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--glass-border)}
.check-item span{font-size:13px;color:var(--head)}.check-item.na span{color:var(--text)}.check-item em{display:block;font-size:10.5px;font-style:normal;color:var(--aqua)}
.tri{display:flex;gap:5px;flex-shrink:0}.tri button{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer}
.tri button.active{background:var(--signal);color:#fff;border-color:transparent}.tri button:disabled{opacity:.35}
.camera-row{display:flex;gap:12px}.camera-slot{flex:1;aspect-ratio:4/3;border-radius:var(--r-md);border:1px dashed var(--glass-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;cursor:pointer}

  function loadExcelJS() { if (window.ExcelJS) return Promise.resolve(); return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'; s.onload = res; s.onerror = () => rej(new Error('Gagal memuat pustaka Excel (exceljs dari cdnjs) — periksa koneksi')); document.head.append(s); }); }
  /** Ambil foto (data URL) untuk banyak file id sekaligus — 8 per panggilan, memakai cache S.cache. */
  async function fetchPhotos(ids, onProgress) { const need = Array.from(new Set(ids.filter(Boolean))).filter(id => !S.cache[id]); let done = 0;
    for (let i = 0; i < need.length; i += 8) { const part = need.slice(i, i + 8); const r = await api('photos', { file_ids: part }); part.forEach(id => { if (r[id]) S.cache[id] = r[id]; }); done += part.length; onProgress && onProgress(done, need.length); } }

    const head = ws => { const row = ws.getRow(ws.rowCount); row.eachCell(cell => { cell.font = { name: F, bold: true, color: { argb: 'FFFFFFFF' } }; cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F3A5F' } }; cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; }); };
    const w1 = wb.addWorksheet('HQI'); w1.columns = [{ width: 34 }, { width: 12 }, { width: 12 }, { width: 12 }, { width: 12 }, { width: 12 }, { width: 12 }, { width: 18 }, { width: 46 }];
    w1.addRow(['Laporan HQI — ' + meta.pabrik]); w1.getRow(1).font = { name: F, bold: true, size: 14 }; w1.addRow(['Periode ' + r.periode.mulai + ' s/d ' + r.periode.selesai + ' · dibuat ' + fmtDT(new Date().toISOString()) + ' oleh ' + S.user.nama]); w1.addRow([]);
    w1.addRow(['Vendor', 'Temuan', 'SLA', 'Spot-Check', 'Checklist', 'Kepatuhan', 'HQI', 'Predikat', 'Catatan']); head(w1);
    r.hqi.forEach(x => { const row = w1.addRow([x.vendor, x.skor_temuan, x.skor_sla, x.skor_spotcheck, x.skor_checklist, x.skor_kepatuhan, x.hqi_final, x.grade, x.catatan || '']); row.font = { name: F }; });
    w1.addRow([]); const cfg = S.boot.config; w1.addRow(['Bobot: Temuan ' + cfg.bobot_temuan + '% · SLA ' + cfg.bobot_sla + '% · Spot-Check ' + cfg.bobot_spotcheck + '% · Checklist ' + cfg.bobot_checklist + '% · Kepatuhan ' + cfg.bobot_kepatuhan + '%']).font = { name: F, italic: true };
    const w2 = wb.addWorksheet('Temuan Selesai'); w2.columns = [{ width: 6 }, { width: 22 }, { width: 28 }, { width: 12 }, { width: 18 }, { width: 18 }, { width: 14 }, { width: 24 }, { width: 24 }];
